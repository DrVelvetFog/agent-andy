[[locations]]
names = ["honeymoon island", "honeymoon island state park", "honeymoon island fl", "honeymoon island florida"]
place = "Honeymoon Island State Park, Florida"
verdict = "limited"
evidence = "primary"
conditions = "Prohibited on all Florida state park land EXCEPT coastal parks, and there only in a park-manager-designated zone between the toe of the dune and the high-water line. Never submerged; objects over 50 years old may not be kept. If the manager-designated zone for this visit is not confirmed, stage it."
source_name = "Florida State Parks, official FAQ, section 1.6"
source_url = "https://www.floridastateparks.org/plan-your-visit/faqs"
source_quote = "metal detecting is prohibited on all state park lands, except for coastal parks. In these parks, metal detecting may occur within certain beach areas located between the toe of the dune and the high-water line, as designated by the park manager. Metal detecting in submerged locations is not permitted."
checked = "2026-10-27"

[[locations]]
names = ["jekyll island", "jekyll", "jekyll island ga", "jekyll island georgia"]
place = "Jekyll Island, Georgia"
verdict = "restricted"
evidence = "primary_draft"
conditions = "Prohibited islandwide: detectors, magnetometers, side scan sonar, sub-bottom profilers, magnets, or any device for detecting metals/minerals/artifacts or treasure hunting, except a device broken down and stored, navigation equipment, and authorized scientific or administrative equipment."
source_name = "Jekyll Island Authority code text (Chapter E), code revision document"
source_url = "https://www.jekyllisland.com/wp-content/uploads/2022/05/20220531_Code-Revision-Revised-First-Reading.r.pdf"
source_quote = "Use of a mineral or metal detector, magnetometer, side scan sonar, sub-bottom profiler, magnet, or any other device for the detection of metals, minerals, artifacts, or lost articles or for treasure hunting is prohibited."
caveat = "Primary source is a 2022 revised first-reading draft; JIA safety publications repeat the same prohibition. Enacted ordinance not yet pinned."
recheck_by = "2026-11-09"
checked = "2026-10-27"

