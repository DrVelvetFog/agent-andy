# Agent Andy — "can I detect here?" demo sample
#
# Authored NEW for the hackathon demo (vetted by Cosmo, 2026-10-27). Nothing here
# is imported from wheretodetect.org pages, verdicts, or copy — place names overlap
# only because these are public places. Every verdict below was checked against the
# PRIMARY source named, on 2026-10-27, and is quoted or paraphrased from that source
# only.
#
# Hard rules (enforced by agent/detect.py):
#   - Andy answers a verdict ONLY when a cited primary source supports it. Anything
#     uncertain, conflicting, or not in this set is STAGED as "unverified — needs a
#     human", never a confident guess.
#   - Two axes, kept distinct in every receipt: the RULE VERDICT (what the rule says)
#     and the EVIDENCE TIER (whether Andy is entitled to report it). A staged receipt
#     is a success — it proves the gate fired.
#   - No expansion by inference: one beach is not the next beach, one park is not all
#     parks in its system. A place not listed here is staged, not guessed.
#   - This is demo data, not legal advice and not a general rule database.
#   - RECHECK every source before the Nov 9 live final. A sample verified Oct 27 is
#     not a promise about Nov 9.
#
# evidence tiers: "primary" (cited primary source -> answer) |
#                 "primary_draft" (primary but a draft -> answer with caveat, or
#                                  STAGE under strict mode) |
#                 "absent" (no primary found -> always stage).

[[locations]]
names = ["myrtle beach", "myrtle beach public beach", "myrtle beach sc", "myrtle beach south carolina"]
place = "Myrtle Beach public beach, South Carolina"
verdict = "allowed"
evidence = "primary"
conditions = "Allowed on the public beach only — NOT in the dunes, the street ends, or any other public property."
source_name = "City of Myrtle Beach, official beach laws page"
source_url = "https://www.cityofmyrtlebeach.com/news_detail_T6_R462.php"
source_quote = "Metal detecting is allowed on the public beach, but NOT in the dunes, the street ends or any other public property."
checked = "2026-10-27"

