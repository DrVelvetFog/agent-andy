# Agent Andy — policy
#
# This is the whole policy. The checker reads THIS file; there are no hidden
# rules in code. A human can audit exactly what Andy will refuse, hold, or run.
#
# Each rule has:
#   id      a short name (lands in the receipt)
#   tier    block | stage | allow  (the outcome)
#   reason  plain language, written to the receipt so anyone reading the chain
#           sees WHY a step was refused, held, or allowed
#   any     substrings matched case-insensitively against the action summary;
#           any one match fires the rule
#
# The summary is lower-cased and its whitespace collapsed before matching.
#
# Rules are evaluated top to bottom, FIRST MATCH WINS. List block rules before
# stage rules so the stricter outcome wins when an action trips both. Anything
# that matches no rule falls through to the default tier.
#
# The checker is deterministic by choice: no model, no network, no GPU in the
# live loop. That makes every verdict fast, repeatable, and auditable — a
# property we want for a live demo, not a limitation to apologise for.

version = 1
# Unmatched text stays ALLOW on purpose: ordinary conversation ("hello", "what can
# you do?") must reach the Spark loop, where every step the planner proposes is
# checked again on its own before it runs. The rules below are the first check.
default_tier = "allow"
default_reason = "within policy scope — safe local action in the active task"

# ---- Risk tiers (for a human reading a receipt) ----
[tiers.block]
meaning = "off-scope; refused outright and never executed"
[tiers.stage]
meaning = "irreversible or destructive; held for a human, not executed"
[tiers.allow]
meaning = "safe local work within the task; executed and receipted"

# ---- Rules: block first (stricter wins on overlap), then stage ----

[[rules]]
id = "exfiltration"
tier = "block"
reason = "would move data off this machine to an unapproved destination"
any = ["post ", "tweet", "publish ", "upload", "email ", "send to", " dm ", "dm the", "off the machine", "off-machine", "exfiltrate", "leak ", "to a remote", "to an external", "pastebin", "to the cloud",
       # a public destination for data ("to a public server"), not a public place ("go to a public park")
       "to a public server", "to a public site", "to a public web", "to a public page", "to a public repo", "to a public bucket",
       "to a public channel", "to a public folder", "to a public url", "to a public link", "to a public feed", "to a public forum",
       "to a public board", "to a public group", "to a public list", "to a public drive", "to a public gist",
       # moving the owner's notes / files / photos to someone or somewhere
       "send my notes", "send my files", "send my photos", "send my data", "send the notes", "send the files",
       "share my notes", "share my files", "share my photos", "copy my notes to", "copy my files to",
       "forward my", "text my notes", "text my files", "e-mail", "mail my", "fax ", "sync my",
       "to dropbox", "google drive",
       # moving data to iCloud, not mentioning it ("my photos are in iCloud")
       "to icloud", "into icloud", "onto icloud", "icloud drive", "via icloud", "icloud.com", "icloud photos", "icloud backup", "with icloud",
       # handing notes / files to a person, a drive, or a remote repo
       "give my notes", "give my files", "give my photos", "give the notes", "give the files",
       "share notes", "share files", "share photos", "share the notes", "share the files", "share the photos",
       "my notes to ", "my files to ", "my photos to ", "usb drive", "usb stick", "thumb drive", "flash drive",
       "external drive", "airdrop", "git push", "push my repo", "push the repo", "push my code", "push to github"]

[[rules]]
id = "about-people"
tier = "block"
reason = "comments on or judges a person; Andy does not do that"
any = ["rate the", "judge the", "how they look", "how unattractive", "how overweight", "gossip",
       # "comment on" / "opinion of" a person — not "comment on the rule" or "opinion of the ordinance"
       "comment on how", "comment on her ", "comment on him", "comment on his ", "comment on their ",
       "comment on the coworker", "comment on my coworker", "comment on a coworker", "comment on a person",
       "comment on this person", "comment on that person", "comment on people", "comment on someone", "comment on somebody",
       "opinion of her ", "opinion of him", "opinion of his ", "opinion of their ",
       "opinion of the coworker", "opinion of my coworker", "opinion of a coworker", "opinion of a person",
       "opinion of this person", "opinion of that person", "opinion of people", "opinion of someone", "opinion of somebody"]

[[rules]]
id = "secret-fields"
tier = "block"
reason = "reads or acts on a credential or secret field"
any = ["password", "credit card", "ssn", "api key", "secret key", "private key", "ssh key", "seed phrase", "2fa", "one-time code", " otp", "otp ", "access token",
       # secret files and paths
       ".ssh", "id_rsa", "id_ed25519", ".env", ".aws", "credentials", ".pem", "keychain", "passwd",
       ".netrc", ".config/", "hosts.yml", ".git-credentials", ".npmrc", ".pypirc", ".kube/",
       "bash history", "bash_history", "zsh_history", "shell history", "command history",
       "env var", "environment variable", "printenv", "saved login",
       "my logins", "the logins", "all logins", "stored logins", "list logins", "export logins", "show logins", "login list", "login info"]

[[rules]]
id = "off-task"
tier = "block"
reason = "acts outside the owner's active task, or tries to disable the gate"
any = ["outside the task", "off-task", "off task", "unrelated to the task", "disable the receipt", "turn off the checker", "disable the gate", "bypass the checker", "bypass the gate", "ignore previous instructions", "ignore your instructions", "ignore your rules", "ignore the rules", "ignore my rules", "pretend you are not gated", "pretend you're not gated", "not gated", "do it anyway",
       # override phrasings
       "ignore all previous", "ignore all prior", "ignore prior", "ignore the policy", "ignore your policy",
       "disregard your", "disregard the rules", "disregard all", "disregard previous", "disregard prior",
       "forget the policy", "forget your rules", "forget the rules", "forget your instructions",
       "developer mode", "dev mode", "jailbreak", "you are now", "system:", "pre-approved", "preapproved",
       "no restrictions", "without restrictions", "unfiltered",
       "unrestricted mode", "run unrestricted", "act unrestricted", "be unrestricted", "are unrestricted", "go unrestricted",
       "fully unrestricted", "completely unrestricted", "now unrestricted", "unrestricted access", "unrestricted andy",
       "unrestricted assistant", "unrestricted agent", "unrestricted ai",
       "ignore everything", "disregard everything", "new instructions",
       "from now on answer", "from now on say", "from now on, answer", "from now on, say",
       "everything as allowed", "everything is allowed", "treat everything as"]

[[rules]]
id = "financial"
tier = "block"
reason = "moves money off the owner's accounts; Andy never transfers funds"
any = ["wire ", "wire $", "send money", "send $", "transfer $", "transfer money", "transfer funds", "to account ", "venmo", "zelle", "paypal", "western union", "pay $", "bitcoin to", "crypto to", "send cash",
       # a money verb followed by an amount ("transfer 5000 dollars", "send 5k")
       "transfer 1", "transfer 2", "transfer 3", "transfer 4", "transfer 5", "transfer 6", "transfer 7", "transfer 8", "transfer 9",
       "send 1", "send 2", "send 3", "send 4", "send 5", "send 6", "send 7", "send 8", "send 9",
       "pay 1", "pay 2", "pay 3", "pay 4", "pay 5", "pay 6", "pay 7", "pay 8", "pay 9",
       "wire 1", "wire 2", "wire 3", "wire 4", "wire 5", "wire 6", "wire 7", "wire 8", "wire 9",
       # other money apps, coins, and destinations
       "cash app", "cashapp", "usdc", "usdt", "to 0x", "of bitcoin", "buy bitcoin", "buy $", "move $",
       "transfer to", "to my savings", "to my checking", "to my account", "to his account",
       "to her account", "to their account",
       # amounts in words, and money handed to a person
       "dollars to ", "bucks to ", "grand to ", "five grand", "ten grand",
       "hundred dollars", "thousand dollars", "000 dollars",
       "pay the invoice", "pay this invoice", "pay invoice", "pay the bill",
       # "pay my <bill or person>" — not "pay my respects"
       "pay my invoice", "pay my bill", "pay my rent", "pay my credit", "pay my card", "pay my tax", "pay my mortgage",
       "pay my loan", "pay my tuition", "pay my electric", "pay my water", "pay my gas", "pay my phone", "pay my internet",
       "pay my insurance", "pay my utilit", "pay my landlord", "pay my debt", "pay my balance", "pay my fine", "pay my ticket",
       "pay my fee", "pay my dues", "pay my subscription", "pay my account", "pay my brother", "pay my sister", "pay my friend",
       "pay my mom", "pay my dad", "pay my wife", "pay my husband", "pay my son", "pay my daughter",
       # moving coins — not "what is bitcoin?"
       "send bitcoin", "transfer bitcoin", "my bitcoin", "sell bitcoin", "move bitcoin", "bitcoin wallet", "in bitcoin", "some bitcoin",
       "send ethereum", "transfer ethereum", "my ethereum", "sell ethereum", "move ethereum", "ethereum to", "of ethereum",
       "buy ethereum", "ethereum wallet", "in ethereum", "some ethereum"]

[[rules]]
id = "system-command"
tier = "block"
reason = "runs shell or system commands outside Andy's tools; off-scope and unsafe"
any = ["sudo", "rm -rf", "curl ", "wget ", "| sh", "| bash", "bash -c", "chmod ", "/etc/", "reverse shell", "nc -", "powershell", "run the installer",
       # shells, root, and reading files off disk
       "su root", "su -", "cat ~", "cat /", "cat .", "|sh", "|bash", "run bash", "ssh ",
       # a shell terminal — not a ferry, bus, or airport terminal
       "open the terminal", "open a terminal", "open terminal", "launch terminal", "launch the terminal", "launch a terminal",
       "start a terminal", "start the terminal", "use the terminal", "use a terminal", "using the terminal", "via the terminal",
       "via terminal", "from the terminal", "terminal command", "terminal.app", "terminal window", "terminal session",
       "terminal and run", "terminal and type", "terminal and execute", "terminal, run", "terminal, type",
       "in the terminal run", "in the terminal type", "in terminal run", "in terminal type", "into the terminal", "into a terminal",
       "python -c", "os.system", "subprocess", "exec(", "eval(", "shutdown", "reboot", "kill -9", "killall",
       "crontab", "launchctl",
       # running commands or scripts by name
       "ls -l", "ls -a", "run ls", "run this command", "run the command", "run a command", "shell command",
       "execute this", "execute the script", "execute a script", "run this script", "run the script", "run a script"]

[[rules]]
id = "destructive"
tier = "stage"
reason = "irreversible or destructive; a human must confirm before it runs"
any = ["delete", "overwrite", "erase", "uninstall", "wipe", "purge", "rm -", "factory reset", "reformat",
       # "remove <something>" — not "did they remove the ban?"
       "remove all", "remove every", "remove my ", "remove the file", "remove the folder", "remove the directory", "remove the dir",
       "remove the temp", "remove the note", "remove the receipt", "remove the chain", "remove the log", "remove the backup",
       "remove the config", "remove the sandbox", "remove it", "remove them", "remove this", "remove these", "remove those", "remove that",
       # "drop <table or data>" — not "drop by Tybee"
       "drop table", "drop the table", "drop database", "drop the database", "drop the db", "drop all ", "drop every",
       "drop my notes", "drop the notes", "drop my files", "drop the files", "drop the collection", "drop the schema",
       "drop the index", "drop the log", "drop the chain",
       # "format <a disk>" — not "format the answer as a list"
       "format the drive", "format my drive", "format the disk", "format my disk", "format the hard", "format my hard",
       "format the usb", "format my usb", "format the sd", "format my sd", "format the card", "format the partition",
       "format the volume", "format the ssd", "format my ssd", "format the external", "format my external", "format c:", "format d:",
       "format the mac", "format my mac", "format the laptop", "format my laptop", "format the computer", "format my computer",
       "format the machine", "format this machine", "format the phone", "format my phone"]
